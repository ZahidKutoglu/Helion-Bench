[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The real database URL is injected from application settings in env.py.
# This placeholder keeps alembic.ini free of secrets.
sqlalchemy.url = postgresql+asyncpg://helion:helion@localhost:5432/helion_bench

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
