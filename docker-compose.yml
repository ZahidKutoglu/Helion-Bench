# Helion Bench — local infrastructure for Phase 1
# Start only the data stores while you run the API and UI on your machine:
#   docker compose up -d postgres qdrant
#
# These credentials match .env.example. They are for local development of
# synthetic data only. Do not reuse them for real engineering data.

name: helion-bench

services:
  postgres:
    image: postgres:16-alpine
    container_name: helion-postgres
    environment:
      POSTGRES_USER: helion
      POSTGRES_PASSWORD: helion
      POSTGRES_DB: helion_bench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helion -d helion_bench"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: helion-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helion-api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      APP_NAME: Helion Bench
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      DATABASE_URL: postgresql+asyncpg://helion:helion@postgres:5432/helion_bench
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      LLM_PROVIDER: dev
      EMBEDDING_PROVIDER: dev
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: helion-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
  qdrant_data:
